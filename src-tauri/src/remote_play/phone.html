<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>OpenRetro no celular</title>
<style>
  :root {
    --bg: #151515; --panel: #1c1c1c; --border: #ffffff26; --text: #e9eaee;
    --muted: #c0c1c7; --body: #8e919b; --pad: #ffffff1f; --pad-on: #ffffff59;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--muted); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; }
  /* The landscape stage. Held upright, the phone shows it turned sideways,
     like any mobile game; --w and --h are its landscape size in pixels. */
  #app { position: fixed; top: 0; left: 0; width: var(--w, 100vw); height: var(--h, 100vh); overflow: hidden; transform-origin: 0 0; }
  #app.turned { transform: translateX(var(--h)) rotate(90deg); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); background: linear-gradient(#000b, #0000); z-index: 5; }
  #title { flex: 1; overflow: hidden; color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
  .chip { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #0008; font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--muted); color: #1c1c1c; border-color: transparent; }
  #menu { position: absolute; top: 52px; right: 12px; max-height: calc(var(--h, 100vh) - 64px); overflow-y: auto; z-index: 6; display: none; min-width: 190px; padding: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  #menu.open { display: grid; }
  #menu button { padding: 10px 12px; border-radius: 6px; text-align: left; font-size: 14px; }
  #menu button:active { background: #ffffff14; }
  #menu .players { display: flex; gap: 6px; padding: 6px; }
  #menu .players button { flex: 1; padding: 8px 0; border: 1px solid var(--border); text-align: center; }
  #menu .players button.on { background: var(--muted); color: #1c1c1c; }
  #menu small { padding: 8px 12px 0; color: var(--body); font-size: 11px; }
  /* Touch controls float over the game where thumbs rest: the d-pad on the
     left, the face buttons on the right, both centred a little below the
     middle. Sizes follow the stage height so every phone gets the same feel. */
  #controls { position: absolute; inset: 0; z-index: 4; --u: calc(var(--h, 100vh) / 100); --side: max(calc(var(--u) * 6), env(safe-area-inset-left)); }
  #controls.hidden { display: none; }
  .btn, #dpad { position: absolute; display: grid; place-items: center; border: 2px solid #ffffff38; background: #ffffff1c; color: #ffffffd9; font-weight: 700; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .btn.on { background: #ffffff59; border-color: #ffffff8c; }
  #dpad { left: var(--side); top: calc(var(--u) * 58); width: calc(var(--u) * 46); height: calc(var(--u) * 46); border-radius: 50%; transform: translateY(-50%); }
  #dpad i { position: absolute; width: 0; height: 0; border: calc(var(--u) * 3) solid transparent; opacity: .75; }
  #dpad .u { top: calc(var(--u) * 4); border-bottom-color: #fff; } #dpad .d { bottom: calc(var(--u) * 4); border-top-color: #fff; }
  #dpad .l { left: calc(var(--u) * 4); border-right-color: #fff; } #dpad .r { right: calc(var(--u) * 4); border-left-color: #fff; }
  #dpad.u .u, #dpad.d .d, #dpad.l .l, #dpad.r .r { opacity: 1; border-width: calc(var(--u) * 3.6); }
  /* Face buttons in a diamond around (right edge - 25u, 58u). */
  .face { width: calc(var(--u) * 17); height: calc(var(--u) * 17); border-radius: 50%; font-size: calc(var(--u) * 6.5); transform: translate(50%, -50%); }
  #a { right: calc(var(--side) + var(--u) * 8); top: calc(var(--u) * 58); }
  #b { right: calc(var(--side) + var(--u) * 25); top: calc(var(--u) * 75); }
  #x { right: calc(var(--side) + var(--u) * 25); top: calc(var(--u) * 41); }
  #y { right: calc(var(--side) + var(--u) * 42); top: calc(var(--u) * 58); }
  .shoulder { top: calc(var(--u) * 15); width: calc(var(--u) * 26); height: calc(var(--u) * 12); border-radius: calc(var(--u) * 4); font-size: calc(var(--u) * 4.6); }
  .shoulder.small { width: calc(var(--u) * 18); }
  #l { left: var(--side); } #l2 { left: calc(var(--side) + var(--u) * 28); }
  #r { right: var(--side); } #r2 { right: calc(var(--side) + var(--u) * 28); }
  .meta { bottom: calc(var(--u) * 4); width: calc(var(--u) * 22); height: calc(var(--u) * 9); border-radius: calc(var(--u) * 4.5); background: #000000a6; font-size: calc(var(--u) * 3.4); }
  .meta.on { background: #000000d9; border-color: #ffffff8c; }
  #select { left: calc(50% - var(--u) * 24); } #start { left: calc(50% + var(--u) * 2); }
  /* Overlays */
  .sheet { position: absolute; inset: 0; z-index: 8; display: none; overflow-y: auto; padding: max(20px, env(safe-area-inset-top)) 20px 20px; background: var(--bg); }
  .sheet.open { display: block; }
  .sheet h1 { margin: 8px 0 4px; color: var(--text); font-size: 20px; }
  .sheet p { margin: 0 0 16px; color: var(--body); font-size: 14px; }
  #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  #games { align-items: start; }
  #games button { overflow: hidden; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); text-align: left; }
  #games img, #games .art { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #222; }
  #games span { display: block; padding: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  #games small { display: block; padding: 0 8px 8px; color: var(--body); font-size: 11px; }
  .sheet, .sheet *, #menu, #menu * { touch-action: pan-y; }
  #start-overlay { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: #000d; text-align: center; }
  #start-overlay strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }
  #start-overlay span { color: var(--body); font-size: 14px; }
  #notice { position: absolute; left: 50%; bottom: 60px; z-index: 7; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: #000c; color: var(--muted); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #notice.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
<img id="screen" alt="">
<div id="bar">
  <span id="title">OpenRetro</span>
  <button class="chip" id="player-chip">J1</button>
  <button class="chip" id="menu-chip" aria-label="Menu">☰</button>
</div>
<div id="menu" role="menu">
  <div class="players" id="players"></div>
  <button data-action="save">Salvar estado</button>
  <button data-action="load">Carregar estado</button>
  <button id="home-button">Voltar ao OpenRetro</button>
  <button id="library-button">Escolher outro jogo</button>
  <button id="fullscreen">Tela cheia</button>
  <button id="touch-toggle">Esconder controles</button>
  <button data-action="quit">Sair do jogo</button>
  <small id="stats"></small>
</div>
<div id="controls">
  <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
  <button class="btn face" id="a" data-bit="8">A</button>
  <button class="btn face" id="b" data-bit="0">B</button>
  <button class="btn face" id="x" data-bit="9">X</button>
  <button class="btn face" id="y" data-bit="1">Y</button>
  <button class="btn shoulder" id="l" data-bit="10">L</button>
  <button class="btn shoulder" id="r" data-bit="11">R</button>
  <button class="btn shoulder small" id="l2" data-bit="12">L2</button>
  <button class="btn shoulder small" id="r2" data-bit="13">R2</button>
  <button class="btn meta" id="select" data-bit="2">SELECT</button>
  <button class="btn meta" id="start" data-bit="3">START</button>
</div>
<section class="sheet" id="library">
  <h1>Escolha um jogo</h1>
  <p id="library-hint">O jogo abre no computador e aparece aqui.</p>
  <div id="games"></div>
</section>
<div id="start-overlay"><div><strong>Toque para começar</strong><span>O som e a tela cheia precisam de um toque.</span></div></div>
<div id="notice"></div>
</div>
<script>
(() => {
  const token = new URLSearchParams(location.search).get("t") || "";
  const $ = (id) => document.getElementById(id);
  const screen = $("screen"), title = $("title"), notice = $("notice");
  let ws, game = null, library = [], player = Number(localStorage.getItem("openretro-player") || 1);
  let touchButtons = 0, dpadBits = 0, padButtons = 0, axes = [0, 0, 0, 0], sent = "";
  let frames = 0, bytes = 0, objectUrl = null, decoding = false, pending = null;

  // Always landscape: held upright, the stage is drawn turned a quarter.
  const app = $("app");
  let turned = false;
  function layout() {
    const width = window.innerWidth, height = window.innerHeight;
    turned = height > width;
    app.style.setProperty("--w", `${turned ? height : width}px`);
    app.style.setProperty("--h", `${turned ? width : height}px`);
    app.classList.toggle("turned", turned);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 250));
  layout();

  // Full screen and a locked landscape where the browser allows it (Android);
  // elsewhere the turned stage keeps the game sideways.
  async function goFullscreen() {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      await window.screen.orientation?.lock?.("landscape");
    } catch {}
    layout();
  }

  // No zooming: double taps and pinches would leave the page stuck enlarged.
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  for (const type of ["gesturestart", "gesturechange"]) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTap = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTap < 350 && e.target.closest && e.target.closest("#controls, #screen, #bar")) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  function toast(text) {
    notice.textContent = text; notice.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => notice.classList.remove("show"), 2200);
  }
  function send(message) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }
  function sendPad(force) {
    const state = { type: "pad", player, buttons: touchButtons | dpadBits | padButtons, axes };
    const key = JSON.stringify(state);
    if (force || key !== sent) { sent = key; send(state); }
  }

  // Video: show the newest frame; skip frames that arrive while one decodes.
  function showFrame(data) {
    if (decoding) { pending = data; return; }
    decoding = true;
    const url = URL.createObjectURL(new Blob([data], { type: "image/jpeg" }));
    screen.onload = screen.onerror = () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = url; decoding = false;
      if (pending) { const next = pending; pending = null; showFrame(next); }
    };
    screen.src = url;
  }

  // Audio: schedule PCM chunks just ahead of the clock and drop backlog.
  let audio = null, playAt = 0;
  function playSound(view) {
    if (!audio || audio.state !== "running") return;
    const rate = view.getUint32(1, true), count = (view.byteLength - 5) / 4;
    if (count <= 0) return;
    const buffer = audio.createBuffer(2, count, rate);
    const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
    for (let i = 0; i < count; i++) {
      left[i] = view.getInt16(5 + i * 4, true) / 32768;
      right[i] = view.getInt16(7 + i * 4, true) / 32768;
    }
    const now = audio.currentTime;
    if (playAt < now + 0.03 || playAt > now + 0.25) playAt = now + 0.06;
    const source = audio.createBufferSource();
    source.buffer = buffer; source.connect(audio.destination); source.start(playAt);
    playAt += buffer.duration;
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { title.textContent = game || "Conectado"; sendPad(true); };
    ws.onmessage = (event) => {
      if (typeof event.data === "string") return status(JSON.parse(event.data));
      const view = new DataView(event.data);
      bytes += event.data.byteLength;
      if (view.getUint8(0) === 1) { frames++; showFrame(new Uint8Array(event.data, 1)); }
      else if (view.getUint8(0) === 2) playSound(view);
    };
    ws.onclose = () => { title.textContent = "Reconectando…"; setTimeout(connect, 1000); };
  }

  function status(message) {
    if (message.type !== "status") return;
    // When the game closes, return to OpenRetro's interface.
    if (game && !message.game) return void location.assign("/");
    game = message.game; library = message.library || [];
    title.textContent = game || "Nenhum jogo aberto";
    renderLibrary();
    $("library").classList.toggle("open", !game);
  }

  function renderLibrary() {
    const list = $("games"); list.textContent = "";
    $("library-hint").textContent = library.length
      ? (game ? `Jogando ${game}. Escolher outro fecha o atual no computador.` : "O jogo abre no computador e aparece aqui.")
      : "Adicione jogos à biblioteca no computador para jogar aqui.";
    for (const entry of library) {
      const button = document.createElement("button");
      const art = entry.cover ? Object.assign(document.createElement("img"), { src: entry.cover, loading: "lazy", referrerPolicy: "no-referrer", alt: "" }) : Object.assign(document.createElement("div"), { className: "art" });
      const name = Object.assign(document.createElement("span"), { textContent: entry.title });
      const platform = Object.assign(document.createElement("small"), { textContent: entry.platform.toUpperCase() });
      button.append(art, name, platform);
      button.onclick = () => {
        if (game) { send({ type: "action", action: "quit" }); setTimeout(() => send({ type: "launch", id: entry.id }), 1500); }
        else send({ type: "launch", id: entry.id });
        $("library").classList.remove("open");
        toast(`Abrindo ${entry.title}…`);
      };
      list.append(button);
    }
  }

  // Touch: each pointer presses whatever control is under it, sliding included.
  const controls = $("controls"), dpad = $("dpad"), held = new Map();
  function dpadFrom(x, y) {
    const box = dpad.getBoundingClientRect();
    const sx = x - (box.left + box.width / 2), sy = y - (box.top + box.height / 2);
    // On the turned stage, screen down is the game's right and screen left its down.
    const dx = turned ? sy : sx, dy = turned ? -sx : sy;
    if (Math.hypot(dx, dy) < box.width * 0.14) return 0;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    let bits = 0;
    if (angle > -157.5 && angle < -22.5) bits |= 1 << 4;
    if (angle > 22.5 && angle < 157.5) bits |= 1 << 5;
    if (angle > 112.5 || angle < -112.5) bits |= 1 << 6;
    if (angle > -67.5 && angle < 67.5) bits |= 1 << 7;
    return bits;
  }
  function refreshTouch() {
    touchButtons = 0; dpadBits = 0;
    for (const target of held.values()) {
      if (target.kind === "dpad") dpadBits |= target.bits;
      else touchButtons |= 1 << target.bit;
    }
    controls.querySelectorAll(".btn").forEach((b) => b.classList.toggle("on", [...held.values()].some((t) => t.el === b)));
    dpad.className = ["u", "d", "l", "r"].filter((_, i) => dpadBits & (1 << (4 + i))).join(" ");
    sendPad();
  }
  function track(event) {
    const el = document.elementFromPoint(event.clientX, event.clientY);
    const button = el && el.closest && el.closest(".btn");
    if (el && el.closest && el.closest("#dpad")) held.set(event.pointerId, { kind: "dpad", bits: dpadFrom(event.clientX, event.clientY) });
    else if (button) held.set(event.pointerId, { el: button, bit: Number(button.dataset.bit) });
    else held.delete(event.pointerId);
    refreshTouch();
  }
  controls.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { controls.setPointerCapture(e.pointerId); } catch {}
    track(e);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  controls.addEventListener("pointermove", (e) => { if (held.has(e.pointerId)) track(e); });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) controls.addEventListener(type, (e) => { held.delete(e.pointerId); refreshTouch(); });

  // Bluetooth or USB controllers paired with the phone, in the standard layout.
  const standard = [0, 8, 1, 9, 10, 11, 12, 13, 2, 3, 14, 15, 4, 5, 6, 7];
  function pollGamepads() {
    let buttons = 0, sticks = [0, 0, 0, 0], any = false;
    for (const pad of (navigator.getGamepads ? navigator.getGamepads() : [])) {
      if (!pad) continue; any = true;
      pad.buttons.forEach((b, i) => { if (b.pressed && standard[i] !== undefined) buttons |= 1 << standard[i]; });
      sticks = sticks.map((value, i) => {
        const v = pad.axes[i] || 0;
        return value || (Math.abs(v) > 0.15 ? Math.round(v * 32767) : 0);
      });
    }
    if (any && !controls.classList.contains("hidden") && !pollGamepads.seen) { pollGamepads.seen = true; controls.classList.add("hidden"); toast("Controle conectado"); }
    padButtons = buttons; axes = sticks;
    sendPad();
    requestAnimationFrame(pollGamepads);
  }

  // Menu
  const players = $("players");
  for (let n = 1; n <= 4; n++) {
    const b = Object.assign(document.createElement("button"), { textContent: `J${n}` });
    b.onclick = () => { player = n; localStorage.setItem("openretro-player", n); updatePlayer(); sendPad(true); };
    players.append(b);
  }
  function updatePlayer() {
    $("player-chip").textContent = `J${player}`;
    [...players.children].forEach((b, i) => b.classList.toggle("on", i + 1 === player));
  }
  $("player-chip").onclick = () => { player = player % 4 + 1; localStorage.setItem("openretro-player", player); updatePlayer(); sendPad(true); toast(`Você é o jogador ${player}`); };
  $("menu-chip").onclick = () => $("menu").classList.toggle("open");
  document.querySelectorAll("[data-action]").forEach((b) => b.onclick = () => {
    const action = b.dataset.action;
    if (action === "quit" && !confirm("Sair do jogo no computador?")) return;
    send({ type: "action", action });
    toast({ save: "Estado salvo", load: "Estado carregado", quit: "Saindo do jogo…" }[action]);
    $("menu").classList.remove("open");
  });
  $("home-button").onclick = () => location.assign("/");
  $("library-button").onclick = () => { $("library").classList.add("open"); $("menu").classList.remove("open"); };
  $("fullscreen").onclick = () => { void goFullscreen(); $("menu").classList.remove("open"); };
  $("touch-toggle").onclick = () => {
    const hidden = controls.classList.toggle("hidden");
    $("touch-toggle").textContent = hidden ? "Mostrar controles" : "Esconder controles";
    $("menu").classList.remove("open");
  };
  $("start-overlay").onclick = () => {
    $("start-overlay").remove();
    try { audio = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" }); audio.resume(); } catch {}
    void goFullscreen();
  };
  setInterval(() => {
    $("stats").textContent = `${frames} quadros/s · ${(bytes * 8 / 1e6).toFixed(1)} Mbit/s`;
    frames = 0; bytes = 0;
  }, 1000);
  updatePlayer();
  connect();
  requestAnimationFrame(pollGamepads);
})();
</script>
</body>
</html>
