[package]
name = "openretro"
version = "0.9.0"
description = "An open home for your classic games"
authors = ["OpenRetro contributors"]
edition = "2021"

[lib]
name = "openretro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
base64 = "0.22"
aho-corasick = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
num_cpus = "1"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# zlib-rs replaces the default backend and inflates ZIPs about twice as fast.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util"] }

[dev-dependencies]
# Tests build 7z packages to read patches back from.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util", "compress"] }

[target.'cfg(windows)'.dependencies]
# Phone play: screen capture. Audio comes directly from the managed game runtime.
windows-capture = "2"
# PS3 games share no audio: RPCS3's own process sound, by process loopback.
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
# The completion handler process loopback calls back is a COM object.
windows-core = "0.62"
# Account sessions stay in the current Windows user's credential vault.
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# Upstream SHA-1 uses AWS-LC. Use its shipped assembly objects on Windows.
aws-lc-sys = { version = "0.46", features = ["prebuilt-nasm"] }

# Debug info for every dependency filled target/ with tens of gigabytes.
# Our own code keeps line numbers for backtraces; dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Our capture code and image's generic pixel conversions must keep up with
# 720p frames even during development. Retain debug checks and backtraces.
[profile.dev.package.openretro]
opt-level = 3

# Phone play encodes every frame as JPEG; keep that fast in debug builds too.
[profile.dev.package.image]
opt-level = 3

# Extracting, hashing and downloading gigabytes is slow unoptimized; keep
# the crates doing that work fast in debug builds too.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.librqbit]
opt-level = 3

[profile.dev.package.sevenz-rust2]
opt-level = 3

# The catalog search runs on bundled SQLite; unoptimized it is several times slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Keep worker-thread AppHandle clones from touching Tao's non-atomic Rc counts.
# See vendor/tauri-runtime-wry/OPENRETRO-PATCH.md.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
