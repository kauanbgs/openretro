[package]
name = "openretro"
version = "0.4.1"
description = "An open home for your classic games"
authors = ["OpenRetro contributors"]
edition = "2021"

[lib]
name = "openretro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
aho-corasick = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
num_cpus = "1"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util"] }
tokio-util = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
# zlib-rs replaces the default backend and inflates ZIPs about twice as fast.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# Phone play: screen capture for OpenRetro's own screens, and the PC's sound.
windows-capture = "2"
cpal = "0.18"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# Upstream SHA-1 uses AWS-LC. Use its shipped assembly objects on Windows.
aws-lc-sys = { version = "0.46", features = ["prebuilt-nasm"] }

# Debug info for every dependency filled target/ with tens of gigabytes.
# Our own code keeps line numbers for backtraces; dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Phone play encodes every frame as JPEG; keep that fast in debug builds too.
[profile.dev.package.image]
opt-level = 3

# Extracting, hashing and downloading gigabytes is slow unoptimized; keep
# the crates doing that work fast in debug builds too.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.librqbit]
opt-level = 3

[profile.dev.package.sevenz-rust2]
opt-level = 3
