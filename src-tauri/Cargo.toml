[package]
name = "openretro"
version = "0.2.0"
description = "An open home for your classic games"
authors = ["OpenRetro contributors"]
edition = "2021"

[lib]
name = "openretro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
aho-corasick = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
num_cpus = "1"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# Upstream SHA-1 uses AWS-LC. Use its shipped assembly objects on Windows.
aws-lc-sys = { version = "0.46", features = ["prebuilt-nasm"] }
