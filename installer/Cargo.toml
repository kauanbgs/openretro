[package]
name = "openretro-installer"
version = "1.0.0"
description = "The OpenRetro installer"
authors = ["OpenRetro contributors"]
edition = "2021"

# Not part of the app's build: this crate has its own lockfile and target.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
