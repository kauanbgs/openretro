name: Tizen TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/tizen/**"
      - "runtime/tizen/**"
      - "runtime/retroarch/upstream.env"
      - "src/**"
      - "scripts/build-tizen.ps1"
      - "scripts/test-tizen-recipe.ps1"
      - "package*.json"
      - "vite.config.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:tizen:web
      - name: Validate Tizen recipe
        shell: pwsh
        run: ./scripts/test-tizen-recipe.ps1
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch 3.1.46 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.46
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.46
      - name: Build pinned RetroArch WebAssembly runtime
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash runtime/tizen/build-emscripten.sh
      - name: Stage unsigned Tizen application
        shell: pwsh
        run: ./scripts/build-tizen.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openretro-tizen-unsigned
          path: |
            .tizen-stage
            dist-runtime/openretro-runtime-tizen-source-*.tar.gz
          if-no-files-found: error
          retention-days: 14
