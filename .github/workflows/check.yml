name: Validate OpenRetro
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate runtime recipe
        shell: pwsh
        run: ./scripts/test-runtime-recipe.ps1
      - run: npm test
      - run: npm ci --prefix party-server
      - run: npm test --prefix party-server
      - run: npm run build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-release-v1-${{ runner.os }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check concurrent Windows runtime handles
        if: runner.os == 'Windows'
        run: cargo run --manifest-path src-tauri/Cargo.toml --example runtime_thread_stress
      # Release tags can restore caches from main, but not from other tags.
      # Warm the optimized, custom-protocol dependency build before publishing.
      - name: Warm Windows release dependencies
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare and verify minimal OpenRetro Runtime
        uses: ./.github/actions/runtime
