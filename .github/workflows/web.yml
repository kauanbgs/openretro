name: Publish OpenRetro web

on:
  push:
    branches: [main]
    # The site, plus the app's web build that is published under /play/.
    paths:
      - "web/**"
      - "shared/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: openretro-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json
      - run: npm ci --prefix web
      - run: npm ci
      # Also builds OpenRetro in the browser into /play/ (web/scripts/build-play.mjs).
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
