name: Publish OpenRetro

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-release-v1-${{ runner.os }}
      - run: npm ci
      - name: Prepare minimal OpenRetro Runtime
        uses: ./.github/actions/runtime
      - run: npm run prepare:runtime
      - name: Build and verify Windows startup before publishing
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-desktop-startup.ps1 -Executable ./src-tauri/target/release/openretro.exe
      - name: Read release notes
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $notes = Get-Content "docs/RELEASE_$version.md" -Raw
          $delimiter = "RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          "OPENRETRO_RELEASE_NOTES<<$delimiter" >> $env:GITHUB_ENV
          $notes >> $env:GITHUB_ENV
          $delimiter >> $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OpenRetro v__VERSION__
          releaseBody: ${{ env.OPENRETRO_RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          updaterJsonKeepRelease: true
      - name: Attach runtime binary and corresponding source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Get-ChildItem dist-runtime -File | ForEach-Object {
            gh release upload "v$version" $_.FullName --clobber
          }
      - name: Attach installer under a stable name for the website
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "OpenRetro_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer for $version not found" }
          $stable = Join-Path $env:RUNNER_TEMP "OpenRetro-Setup.exe"
          Copy-Item $setup.FullName $stable
          gh release upload "v$version" $stable --clobber
