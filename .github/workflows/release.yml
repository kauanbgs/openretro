name: Publish OpenRetro

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-release-v1-${{ runner.os }}
      - run: npm ci
      - name: Prepare minimal OpenRetro Runtime
        uses: ./.github/actions/runtime
      - run: npm run prepare:runtime
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OpenRetro v__VERSION__
          releaseBody: See the release notes for changes.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepRelease: true
      - name: Attach runtime binary and corresponding source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Get-ChildItem dist-runtime -File | ForEach-Object {
            gh release upload "v$version" $_.FullName --clobber
          }
