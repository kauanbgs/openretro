# Base configuration for the private OpenRetro runtime.
# Per-game settings are supplied through --appendconfig at launch.
config_save_on_exit = "false"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_window_show_decorations = "false"
stdin_cmd_enable = "true"
network_cmd_enable = "false"
menu_enable_widgets = "false"
content_history_size = "0"
history_list_enable = "false"
load_dummy_on_core_shutdown = "false"
quit_on_close_content = "1"
